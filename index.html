<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bottlify</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Added to a phone's home screen, the launcher opens with no browser around
    it: Safari on an iPhone has no fullscreen for anything but a video, so this
    is the one way there to play on the whole screen. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bottlify" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
