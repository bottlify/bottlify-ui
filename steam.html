<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bottlify · Steam</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
    body { font: 15px system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 16px;
      background: var(--bg); color: var(--fg); }
    #status { color: var(--muted); }
    /* The code is drawn dark on light whatever the theme: a scanner wants that. */
    #qr svg { display: block; margin: 1rem 0; background: #fff; padding: 12px; max-width: 100%; height: auto; }
    #games { columns: 2; padding-left: 1.2rem; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Steam</h1>
  <p id="status"></p>
  <div id="qr"></div>
  <button id="signout" hidden>Sign out</button>
  <ul id="games"></ul>
  <script type="module" src="/src/steam/page.js"></script>
</body>
</html>
